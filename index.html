<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>🇭🇰 香港旅遊共編</title>

<meta name="theme-color" content="#e53935">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#7b8497;
  --primary:#e53935;
  --primary-dark:#c62828;
  --line:#e8ebf1;
  --green:#16a34a;
  --blue:#2563eb;
  --orange:#f59e0b;
  --red:#dc2626;
  --shadow:0 5px 20px rgba(20,30,50,.08);
}

html,
body {
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

body {
  min-height:100vh;
}

button,
input,
select,
textarea {
  font:inherit;
}

button {
  border:0;
  cursor:pointer;
}

.app {
  max-width:760px;
  margin:auto;
  padding-bottom:110px;
}

/* =========================
   Header
========================= */

.header {
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  padding:
    calc(env(safe-area-inset-top) + 12px)
    16px
    12px;
}

.header-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.title {
  font-size:23px;
  font-weight:900;
}

.subtitle {
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}

.sync {
  font-size:12px;
  color:var(--green);
  white-space:nowrap;
}

.main-tabs {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-top:12px;
  scrollbar-width:none;
}

.main-tabs::-webkit-scrollbar {
  display:none;
}

.main-tab {
  flex:0 0 auto;
  padding:9px 15px;
  border-radius:999px;
  background:#eef1f6;
  color:#566074;
  font-weight:800;
}

.main-tab.active {
  background:var(--primary);
  color:#fff;
}

.day-tabs {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-top:9px;
  scrollbar-width:none;
}

.day-tabs::-webkit-scrollbar {
  display:none;
}

.day-tab {
  flex:0 0 auto;
  padding:8px 14px;
  border-radius:999px;
  background:#f0f2f6;
  color:#596275;
  font-weight:700;
  font-size:13px;
}

.day-tab.active {
  background:#172033;
  color:white;
}

/* =========================
   Content
========================= */

.content {
  padding:15px;
}

.day-title {
  margin:5px 0 8px;
  font-size:20px;
  line-height:1.4;
  font-weight:900;
}

.day-summary {
  color:var(--muted);
  font-size:13px;
  margin-bottom:14px;
}

/* =========================
   Timeline
========================= */

.timeline {
  position:relative;
}

.timeline::before {
  content:"";
  position:absolute;
  left:25px;
  top:15px;
  bottom:15px;
  width:2px;
  background:#e4e7ee;
}

.item {
  position:relative;
  display:grid;
  grid-template-columns:51px 1fr;
  gap:10px;
  margin-bottom:13px;
}

.time {
  position:relative;
  z-index:2;
  width:51px;
  text-align:center;
  padding-top:14px;
  font-size:12px;
  font-weight:800;
  color:#5d6678;
}

.dot {
  width:12px;
  height:12px;
  position:absolute;
  right:-6px;
  top:18px;
  background:var(--primary);
  border:3px solid var(--bg);
  border-radius:50%;
}

.card {
  background:var(--card);
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:14px;
  position:relative;
  border:1px solid rgba(0,0,0,.02);
}

.card.completed {
  opacity:.55;
}

.card.completed .place-name {
  text-decoration:line-through;
}

.place-row {
  display:flex;
  gap:8px;
  align-items:flex-start;
}

.place-name {
  font-size:17px;
  line-height:1.4;
  font-weight:900;
  flex:1;
}

.handle {
  font-size:22px;
  color:#a3a9b6;
  padding:0 2px;
  touch-action:none;
}

.meta {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.badge {
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:#f1f4f8;
  color:#596275;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
}

.note {
  margin-top:8px;
  color:#687286;
  font-size:13px;
  line-height:1.5;
}

.actions {
  display:flex;
  gap:7px;
  margin-top:12px;
}

.action {
  flex:1;
  background:#f2f4f8;
  color:#4c5669;
  padding:9px 5px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.action.map {
  color:#2563eb;
  background:#edf4ff;
}

.action.delete {
  color:#dc2626;
  background:#fff0f0;
}

.action.done {
  color:#16803a;
  background:#edf9f0;
}

.sort-ghost {
  opacity:.3;
}

/* =========================
   Buttons
========================= */

.add-btn {
  width:100%;
  margin-top:4px;
  padding:14px;
  border-radius:15px;
  background:var(--primary);
  color:#fff;
  font-weight:900;
  font-size:15px;
  box-shadow:0 7px 20px rgba(229,57,53,.22);
}

.fab {
  position:fixed;
  z-index:30;
  right:18px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:57px;
  height:57px;
  border-radius:50%;
  background:var(--primary);
  color:white;
  font-size:28px;
  box-shadow:0 8px 25px rgba(229,57,53,.35);
}

/* =========================
   Map
========================= */

.map-section {
  margin-top:15px;
  background:#fff;
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:15px;
}

.map-title {
  font-weight:900;
  margin-bottom:9px;
}

.map-links {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.map-link {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px;
  border-radius:11px;
  background:#f5f7fa;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
}

/* =========================
   Expense
========================= */

.expense-summary {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

.summary-card {
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:var(--shadow);
}

.summary-label {
  color:var(--muted);
  font-size:12px;
}

.summary-value {
  margin-top:5px;
  font-size:22px;
  font-weight:900;
}

.summary-card.red .summary-value {
  color:var(--primary);
}

.summary-card.blue .summary-value {
  color:var(--blue);
}

.expense-card {
  background:white;
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:14px;
  margin-bottom:12px;
}

.expense-row {
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.expense-icon {
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff1f1;
  font-size:20px;
}

.expense-main {
  flex:1;
}

.expense-name {
  font-size:16px;
  font-weight:900;
}

.expense-info {
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.expense-amount {
  font-size:17px;
  font-weight:900;
  text-align:right;
}

.expense-actions {
  display:flex;
  gap:7px;
  margin-top:10px;
}

.expense-actions button {
  flex:1;
  padding:8px;
  border-radius:9px;
  background:#f2f4f8;
  color:#4c5669;
  font-size:12px;
  font-weight:800;
}

.expense-actions .danger {
  background:#fff0f0;
  color:var(--red);
}

.expense-stats {
  margin-top:15px;
  background:white;
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:15px;
}

.expense-stats-title {
  font-weight:900;
  margin-bottom:10px;
}

.stat-row {
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.stat-row:last-child {
  border-bottom:0;
}

/* =========================
   Export
========================= */

.export-box {
  margin-top:15px;
  background:white;
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:15px;
}

.export-title {
  font-weight:900;
  margin-bottom:10px;
}

.export-buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.export-btn {
  padding:12px;
  border-radius:11px;
  background:#172033;
  color:white;
  font-weight:800;
}

.export-btn.expense {
  background:#2563eb;
}

/* =========================
   Modal
========================= */

.modal-bg {
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:rgba(0,0,0,.48);
  padding:20px;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show {
  display:flex;
}

.modal {
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}

.modal-title {
  font-size:20px;
  font-weight:900;
  margin-bottom:15px;
}

.form-group {
  margin-bottom:13px;
}

.form-label {
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:800;
  color:#596275;
}

.form-control {
  width:100%;
  border:1px solid #dfe3eb;
  border-radius:11px;
  padding:11px 12px;
  background:#fafbfc;
  outline:none;
}

.form-control:focus {
  border-color:var(--primary);
  background:white;
}

.form-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.modal-actions {
  display:flex;
  gap:9px;
  margin-top:18px;
}

.modal-btn {
  flex:1;
  padding:13px;
  border-radius:12px;
  font-weight:900;
}

.cancel {
  background:#eef1f5;
  color:#566074;
}

.save {
  background:var(--primary);
  color:white;
}

/* =========================
   Loading / Empty
========================= */

.loading {
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

.empty {
  text-align:center;
  padding:35px 10px;
  color:var(--muted);
}

/* =========================
   Toast
========================= */

.toast {
  position:fixed;
  z-index:200;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(15px);
  background:#172033;
  color:white;
  padding:10px 15px;
  border-radius:999px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}

.toast.show {
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   Share
========================= */

.share-box {
  margin-top:15px;
  background:white;
  border-radius:17px;
  box-shadow:var(--shadow);
  padding:15px;
}

.share-title {
  font-weight:900;
}

.share-url {
  margin-top:7px;
  font-size:12px;
  color:var(--muted);
  word-break:break-all;
}

.share-btn {
  margin-top:9px;
  background:#172033;
  color:white;
  padding:9px 12px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="header-row">

    <div>
      <div class="title">🇭🇰 香港旅遊</div>
      <div class="subtitle">9/9～9/12・多人共編</div>
    </div>

    <div class="sync" id="syncStatus">
      ● 連線中
    </div>

  </div>

  <div class="main-tabs">

    <button class="main-tab active" id="scheduleTab">
      📅 行程
    </button>

    <button class="main-tab" id="expenseTab">
      💰 費用
    </button>

  </div>

  <div class="day-tabs" id="dayTabs"></div>

</header>


<main class="content">

  <div id="content">
    <div class="loading">
      正在載入行程…
    </div>
  </div>

</main>

</div>


<button class="fab" id="addBtn">
  ＋
</button>


<div class="toast" id="toast"></div>


<!-- =========================
     行程 Modal
========================= -->

<div class="modal-bg" id="tripModal">

  <div class="modal">

    <div class="modal-title" id="tripModalTitle">
      新增行程
    </div>

    <div class="form-group">

      <label class="form-label">日期</label>

      <select class="form-control" id="fDay">

        <option value="2026-09-09">9/9（三）</option>
        <option value="2026-09-10">9/10（四）</option>
        <option value="2026-09-11">9/11（五）</option>
        <option value="2026-09-12">9/12（六）</option>

      </select>

    </div>

    <div class="form-group">

      <label class="form-label">景點／店家名稱</label>

      <input
        class="form-control"
        id="fName"
        placeholder="例如：香港迪士尼"
      >

    </div>

    <div class="form-grid">

      <div class="form-group">

        <label class="form-label">開始時間</label>

        <input
          type="time"
          class="form-control"
          id="fStart"
        >

      </div>

      <div class="form-group">

        <label class="form-label">結束時間</label>

        <input
          type="time"
          class="form-control"
          id="fEnd"
        >

      </div>

    </div>

    <div class="form-grid">

      <div class="form-group">

        <label class="form-label">交通模式</label>

        <select class="form-control" id="fTransport">

          <option value="">無</option>
          <option value="🚶 步行">🚶 步行</option>
          <option value="🚇 MTR">🚇 MTR</option>
          <option value="🚌 巴士">🚌 巴士</option>
          <option value="🚋 叮叮車">🚋 叮叮車</option>
          <option value="🚕 的士">🚕 的士</option>
          <option value="🚗 開車">🚗 開車</option>
          <option value="⛵ 船">⛵ 船</option>
          <option value="✈️ 飛機">✈️ 飛機</option>

        </select>

      </div>

      <div class="form-group">

        <label class="form-label">交通時間</label>

        <input
          class="form-control"
          id="fTransportTime"
          placeholder="例如：15 分鐘"
        >

      </div>

    </div>

    <div class="form-group">

      <label class="form-label">備註</label>

      <textarea
        class="form-control"
        id="fNote"
        rows="3"
        placeholder="例如：依實際船班調整"
      ></textarea>

    </div>

    <div class="modal-actions">

      <button class="modal-btn cancel" id="cancelTripBtn">
        取消
      </button>

      <button class="modal-btn save" id="saveTripBtn">
        儲存
      </button>

    </div>

  </div>

</div>


<!-- =========================
     費用 Modal
========================= -->

<div class="modal-bg" id="expenseModal">

  <div class="modal">

    <div class="modal-title" id="expenseModalTitle">
      新增費用
    </div>

    <div class="form-group">

      <label class="form-label">日期</label>

      <select class="form-control" id="eDay">

        <option value="2026-09-09">9/9（三）</option>
        <option value="2026-09-10">9/10（四）</option>
        <option value="2026-09-11">9/11（五）</option>
        <option value="2026-09-12">9/12（六）</option>

      </select>

    </div>

    <div class="form-group">

      <label class="form-label">費用項目</label>

      <input
        class="form-control"
        id="eName"
        placeholder="例如：迪士尼門票"
      >

    </div>

    <div class="form-grid">

      <div class="form-group">

        <label class="form-label">金額</label>

        <input
          type="number"
          class="form-control"
          id="eAmount"
          placeholder="例如：639"
          inputmode="decimal"
        >

      </div>

      <div class="form-group">

        <label class="form-label">幣別</label>

        <select class="form-control" id="eCurrency">

          <option value="HKD">HKD 港幣</option>
          <option value="TWD">TWD 台幣</option>
          <option value="USD">USD 美金</option>
          <option value="JPY">JPY 日圓</option>

        </select>

      </div>

    </div>

    <div class="form-group">

      <label class="form-label">付款人</label>

      <input
        class="form-control"
        id="ePayer"
        placeholder="例如：Kelly"
      >

    </div>

    <div class="form-group">

      <label class="form-label">分類</label>

      <select class="form-control" id="eCategory">

        <option value="餐飲">🍜 餐飲</option>
        <option value="交通">🚇 交通</option>
        <option value="住宿">🏨 住宿</option>
        <option value="門票">🎫 門票</option>
        <option value="購物">🛍️ 購物</option>
        <option value="娛樂">🎢 娛樂</option>
        <option value="其他">📦 其他</option>

      </select>

    </div>

    <div class="form-group">

      <label class="form-label">備註</label>

      <textarea
        class="form-control"
        id="eNote"
        rows="3"
        placeholder="備註"
      ></textarea>

    </div>

    <div class="modal-actions">

      <button class="modal-btn cancel" id="cancelExpenseBtn">
        取消
      </button>

      <button class="modal-btn save" id="saveExpenseBtn">
        儲存
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>


<script type="module">

/* =========================================================
   Firebase
========================================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================================================
   Firebase 設定
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBGBR0VsdGCK_BAKsWE1m2lIUoQYZ07U0Q",
  authDomain: "hongkongtrip.firebaseapp.com",
  projectId: "hongkongtrip",
  storageBucket: "hongkongtrip.firebasestorage.app",
  messagingSenderId: "278709336259",
  appId: "1:278709336259:web:86bcb18312e72ac602ca76",
  measurementId: "G-5GMBP3SX8Y"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   房間 ID
========================================================= */

const params = new URLSearchParams(location.search);

let tripId = params.get("trip");

if (!tripId) {

  tripId =
    "hk-" +
    Math.random()
      .toString(36)
      .substring(2,10);

  const newUrl =
    location.origin +
    location.pathname +
    "?trip=" +
    tripId;

  history.replaceState({}, "", newUrl);

}


/* =========================================================
   全域變數
========================================================= */

let currentUser = null;

let currentDay = "2026-09-09";

let currentPage = "schedule";

let trips = {};

let expenses = [];

let editingTripId = null;

let editingExpenseId = null;


/* =========================================================
   日期資料
========================================================= */

const dayInfo = {

  "2026-09-09":
    "9/9（三）｜抵港＋旺角美食＋叮叮車＋跑馬地賽馬",

  "2026-09-10":
    "9/10（四）｜迪士尼",

  "2026-09-11":
    "9/11（五）｜中環＋銅鑼灣＋尖沙咀＋張保仔號＋摩天輪",

  "2026-09-12":
    "9/12（六）｜九龍＋回台"

};


const dayNames = {

  "2026-09-09":"9/9",

  "2026-09-10":"9/10",

  "2026-09-11":"9/11",

  "2026-09-12":"9/12"

};

/* =========================================================
   建立預設資料
========================================================= */

function buildInitialTrips() {

  const result = {};

  scheduleText
    .trim()
    .split("\n")
    .map(x => x.trim())
    .filter(Boolean)
    .forEach((line,index) => {

      const p = line.split("|");

      const item = {

        id:"d" + (index + 1),

        day:p[0] || "",

        start:p[1] || "",

        end:p[2] || "",

        name:p[3] || "",

        transport:p[4] || "",

        transportTime:p[5] || "",

        note:p[6] || "",

        completed:false

      };

      if (!result[item.day]) {
        result[item.day] = [];
      }

      result[item.day].push(item);

    });

  return result;

}


/* =========================================================
   工具
========================================================= */

function uid(prefix="item") {

  return prefix +
    "-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,7);

}


function esc(value) {

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showToast(text) {

  const el =
    document.getElementById("toast");

  el.textContent = text;

  el.classList.add("show");

  setTimeout(() => {

    el.classList.remove("show");

  },1800);

}


function formatMoney(amount) {

  return Number(amount || 0)
    .toLocaleString("zh-Hant-TW",{
      maximumFractionDigits:2
    });

}

/* =========================================================
   Firebase 讀取
========================================================= */

function loadTrip() {

  const ref =
    doc(db,"trips",tripId);

  onSnapshot(
    ref,
    snapshot => {

      if (!snapshot.exists()) {

        trips =
          buildInitialTrips();

        expenses = [];

        saveTrip();

      } else {

        const data =
          snapshot.data();

        trips =
          data.trips || {};

        expenses =
          Array.isArray(data.expenses)
            ? data.expenses
            : [];

        render();

      }

    },

    error => {

      console.error(error);

      document.getElementById("syncStatus")
        .textContent = "● 同步失敗";

      showToast(
        "資料同步失敗，請檢查 Firestore 規則"
      );

    }
  );

}


/* =========================================================
   Firebase 儲存
========================================================= */

async function saveTrip() {

  if (!currentUser) {
    return;
  }

  try {

    const ref =
      doc(db,"trips",tripId);

    await setDoc(
      ref,
      {
        trips,
        expenses,
        updatedAt:Date.now(),
        updatedBy:currentUser.uid
      },
      {
        merge:true
      }
    );

    document.getElementById("syncStatus")
      .textContent = "● 已同步";

  } catch(error) {

    console.error(error);

    document.getElementById("syncStatus")
      .textContent = "● 儲存失敗";

    showToast("儲存失敗");

  }

}

/* =========================================================
   Render
========================================================= */

function render() {

  const scheduleTab =
    document.getElementById("scheduleTab");

  const expenseTab =
    document.getElementById("expenseTab");

  const dayTabs =
    document.getElementById("dayTabs");

  if (currentPage === "schedule") {

    scheduleTab.classList.add("active");

    expenseTab.classList.remove("active");

    dayTabs.style.display = "flex";

    renderDayTabs();

    renderSchedule();

    document.getElementById("addBtn")
      .style.display = "block";

  } else {

    scheduleTab.classList.remove("active");

    expenseTab.classList.add("active");

    dayTabs.style.display = "none";

    renderExpenses();

    document.getElementById("addBtn")
      .style.display = "block";

  }

}

/* =========================================================
   拖曳排序
========================================================= */

function initSortable() {

  const list =
    document.getElementById("timeline");

  if (
    !list ||
    typeof Sortable === "undefined"
  ) {
    return;
  }

  new Sortable(
    list,
    {

      animation:180,

      handle:".handle",

      delay:120,

      delayOnTouchOnly:true,

      touchStartThreshold:5,

      ghostClass:"sort-ghost",

      onEnd:async function() {

        const ids =
          [...list.querySelectorAll(".item")]
            .map(el => el.dataset.id);

        const old =
          trips[currentDay] || [];

        const map =
          Object.fromEntries(
            old.map(x => [x.id,x])
          );

        trips[currentDay] =
          ids.map(id => map[id]);

        render();

        await saveTrip();

        showToast("順序已同步");

      }

    }
  );

}


/* =========================================================
   上下移
========================================================= */

async function moveItem(id,direction) {

  const list =
    trips[currentDay] || [];

  const index =
    list.findIndex(x => x.id === id);

  const newIndex =
    index + direction;

  if (
    index < 0 ||
    newIndex < 0 ||
    newIndex >= list.length
  ) {
    return;
  }

  [
    list[index],
    list[newIndex]
  ] =
  [
    list[newIndex],
    list[index]
  ];

  trips[currentDay] = list;

  render();

  await saveTrip();

}


/* =========================================================
   完成
========================================================= */

async function toggleDone(id) {

  for (
    const day of Object.keys(trips)
  ) {

    const item =
      (trips[day] || [])
        .find(x => x.id === id);

    if (item) {

      item.completed =
        !item.completed;

      break;

    }

  }

  render();

  await saveTrip();

}


/* =========================================================
   刪除行程
========================================================= */

async function deleteTrip(id) {

  if (
    !confirm("確定要刪除這個行程嗎？")
  ) {
    return;
  }

  for (
    const day of Object.keys(trips)
  ) {

    trips[day] =
      (trips[day] || [])
        .filter(x => x.id !== id);

  }

  render();

  await saveTrip();

  showToast("行程已刪除");

}


/* =========================================================
   行程 Modal
========================================================= */

function openTripModal(id=null) {

  editingTripId = id;

  const modal =
    document.getElementById("tripModal");

  modal.classList.add("show");


  if (id) {

    let item = null;

    for (
      const day of Object.keys(trips)
    ) {

      item =
        (trips[day] || [])
          .find(x => x.id === id);

      if (item) break;

    }

    if (!item) return;

    document.getElementById("tripModalTitle")
      .textContent = "編輯行程";

    document.getElementById("fDay")
      .value = item.day;

    document.getElementById("fName")
      .value = item.name;

    document.getElementById("fStart")
      .value = item.start;

    document.getElementById("fEnd")
      .value = item.end || "";

    document.getElementById("fTransport")
      .value = item.transport || "";

    document.getElementById("fTransportTime")
      .value = item.transportTime || "";

    document.getElementById("fNote")
      .value = item.note || "";

  } else {

    document.getElementById("tripModalTitle")
      .textContent = "新增行程";

    document.getElementById("fDay")
      .value = currentDay;

    document.getElementById("fName")
      .value = "";

    document.getElementById("fStart")
      .value = "";

    document.getElementById("fEnd")
      .value = "";

    document.getElementById("fTransport")
      .value = "";

    document.getElementById("fTransportTime")
      .value = "";

    document.getElementById("fNote")
      .value = "";

  }

}


function closeTripModal() {

  document
    .getElementById("tripModal")
    .classList.remove("show");

  editingTripId = null;

}

  .onclick = closeTripModal;


document.getElementById("tripModal")
  .onclick = e => {

    if (
      e.target.id === "tripModal"
    ) {
      closeTripModal();
    }

  };


/* =========================================================
   儲存行程
========================================================= */

document.getElementById("saveTripBtn")
  .onclick = async () => {

    const day =
      document.getElementById("fDay").value;

    const name =
      document.getElementById("fName")
        .value.trim();

    const start =
      document.getElementById("fStart").value;

    const end =
      document.getElementById("fEnd").value;

    const transport =
      document.getElementById("fTransport").value;

    const transportTime =
      document.getElementById("fTransportTime")
        .value.trim();

    const note =
      document.getElementById("fNote")
        .value.trim();


    if (!name) {

      alert("請輸入景點名稱");

      return;

    }


    if (!trips[day]) {

      trips[day] = [];

    }


    if (editingTripId) {

      let oldItem = null;

      for (
        const d of Object.keys(trips)
      ) {

        const index =
          trips[d].findIndex(
            x => x.id === editingTripId
          );

        if (index >= 0) {

          oldItem =
            trips[d][index];

          trips[d].splice(index,1);

          break;

        }

      }


      trips[day].push({

        ...oldItem,

        day,
        name,
        start,
        end,
        transport,
        transportTime,
        note

      });

    } else {

      trips[day].push({

        id:uid("trip"),

        day,

        start,

        end,

        name,

        transport,

        transportTime,

        note,

        completed:false

      });

    }


    closeTripModal();

    currentDay = day;

    render();

    await saveTrip();

    showToast("行程已儲存");

  };


/* =========================================================
   費用頁
========================================================= */

function renderExpenses() {

  const content =
    document.getElementById("content");

  const totals = {};

  expenses.forEach(e => {

    const currency =
      e.currency || "HKD";

    totals[currency] =
      (totals[currency] || 0) +
      Number(e.amount || 0);

  });


  let summaryHTML = "";

  const currencies =
    Object.keys(totals);

  if (!currencies.length) {

    summaryHTML = `

      <div class="summary-card red">

        <div class="summary-label">
          目前費用
        </div>

        <div class="summary-value">
          尚無
        </div>

      </div>

    `;

  } else {

    summaryHTML =
      currencies.map((currency,index) => `

        <div class="summary-card ${
          index % 2 === 0
          ? "red"
          : "blue"
        }">

          <div class="summary-label">
            ${esc(currency)} 總計
          </div>

          <div class="summary-value">
            ${formatMoney(totals[currency])}
          </div>

        </div>

      `).join("");

  }


  let html = `

    <div class="day-title">
      💰 旅遊費用
    </div>

    <div class="day-summary">
      共 ${expenses.length} 筆費用
    </div>

    <div class="expense-summary">
      ${summaryHTML}
    </div>

    <button
      class="add-btn"
      id="addExpenseBtn"
    >
      ＋ 新增費用
    </button>

  `;


  if (!expenses.length) {

    html += `

      <div class="empty">
        目前還沒有費用
      </div>

    `;

  } else {

    const sorted =
      [...expenses]
        .sort((a,b) =>
          String(a.day)
            .localeCompare(String(b.day))
        );


    sorted.forEach(expense => {

      html += renderExpense(expense);

    });

  }


  html += `

    <div class="expense-stats">

      <div class="expense-stats-title">
        👤 付款人統計
      </div>

      ${renderPayerStats()}

    </div>


    <div class="export-box">

      <div class="export-title">
        📤 匯出
      </div>

      <div class="export-buttons">

        <button
          class="export-btn"
          id="exportTripsBtn"
        >
          📅 匯出行程
        </button>

        <button
          class="export-btn expense"
          id="exportExpensesBtn"
        >
          💰 匯出費用
        </button>

      </div>

    </div>


    <div class="share-box">

      <div class="share-title">
        🔗 分享這個共編行程
      </div>

      <div class="share-url">
        ${esc(location.href)}
      </div>

      <button
        class="share-btn"
        id="shareBtn"
      >
        📋 複製共編網址
      </button>

    </div>

  `;


  content.innerHTML = html;


  document.getElementById("addExpenseBtn")
    .onclick = () => openExpenseModal();


  document.getElementById("exportTripsBtn")
    .onclick = exportTrips;


  document.getElementById("exportExpensesBtn")
    .onclick = exportExpenses;


  document.getElementById("shareBtn")
    .onclick = shareUrl;


  document
    .querySelectorAll("[data-edit-expense]")
    .forEach(btn => {

      btn.onclick = () => {

        openExpenseModal(
          btn.dataset.editExpense
        );

      };

    });


  document
    .querySelectorAll("[data-delete-expense]")
    .forEach(btn => {

      btn.onclick = () => {

        deleteExpense(
          btn.dataset.deleteExpense
        );

      };

    });

}

   費用卡片
========================================================= */

/* =========================================================
   付款人統計
========================================================= */

function renderPayerStats() {

  if (!expenses.length) {

    return `
      <div class="empty">
        尚無付款資料
      </div>
    `;

  }


  const stats = {};


  expenses.forEach(e => {

    const payer =
      e.payer || "未填寫";

    const currency =
      e.currency || "HKD";

    if (!stats[payer]) {
      stats[payer] = {};
    }

    stats[payer][currency] =
      (stats[payer][currency] || 0) +
      Number(e.amount || 0);

  });


  return Object.keys(stats)
    .map(payer => {

      const amounts =
        Object.keys(stats[payer])
          .map(currency =>
            `${currency} ${formatMoney(stats[payer][currency])}`
          )
          .join("　");

      return `

        <div class="stat-row">

          <span>
            👤 ${esc(payer)}
          </span>

          <strong>
            ${amounts}
          </strong>

        </div>

      `;

    })
    .join("");

}


/* =========================================================
   費用 Modal
========================================================= */

function openExpenseModal(id=null) {

  editingExpenseId = id;

  const modal =
    document.getElementById("expenseModal");

  modal.classList.add("show");


  if (id) {

    const expense =
      expenses.find(
        x => x.id === id
      );

    if (!expense) return;


    document.getElementById("expenseModalTitle")
      .textContent = "編輯費用";

    document.getElementById("eDay")
      .value = expense.day;

    document.getElementById("eName")
      .value = expense.name;

    document.getElementById("eAmount")
      .value = expense.amount;

    document.getElementById("eCurrency")
      .value = expense.currency || "HKD";

    document.getElementById("ePayer")
      .value = expense.payer || "";

    document.getElementById("eCategory")
      .value = expense.category || "其他";

    document.getElementById("eNote")
      .value = expense.note || "";

  } else {

    document.getElementById("expenseModalTitle")
      .textContent = "新增費用";

    document.getElementById("eDay")
      .value = currentDay;

    document.getElementById("eName")
      .value = "";

    document.getElementById("eAmount")
      .value = "";

    document.getElementById("eCurrency")
      .value = "HKD";

    document.getElementById("ePayer")
      .value = "";

    document.getElementById("eCategory")
      .value = "餐飲";

    document.getElementById("eNote")
      .value = "";

  }

}


function closeExpenseModal() {

  document
    .getElementById("expenseModal")
    .classList.remove("show");

  editingExpenseId = null;

}


document.getElementById("cancelExpenseBtn")
  .onclick = closeExpenseModal;


document.getElementById("expenseModal")
  .onclick = e => {

    if (
      e.target.id === "expenseModal"
    ) {
      closeExpenseModal();
    }

  };


/* =========================================================
   儲存費用
========================================================= */

document.getElementById("saveExpenseBtn")
  .onclick = async () => {

    const day =
      document.getElementById("eDay").value;

    const name =
      document.getElementById("eName")
        .value.trim();

    const amount =
      Number(
        document.getElementById("eAmount").value
      );

    const currency =
      document.getElementById("eCurrency").value;

    const payer =
      document.getElementById("ePayer")
        .value.trim();

    const category =
      document.getElementById("eCategory").value;

    const note =
      document.getElementById("eNote")
        .value.trim();


    if (!name) {

      alert("請輸入費用項目");

      return;

    }


    if (
      !amount ||
      amount < 0
    ) {

      alert("請輸入正確金額");

      return;

    }


    if (editingExpenseId) {

      const index =
        expenses.findIndex(
          x => x.id === editingExpenseId
        );

      if (index >= 0) {

        expenses[index] = {

          ...expenses[index],

          day,

          name,

          amount,

          currency,

          payer,

          category,

          note

        };

      }

    } else {

      expenses.push({

        id:uid("expense"),

        day,

        name,

        amount,

        currency,

        payer,

        category,

        note

      });

    }


    closeExpenseModal();

    currentPage = "expense";

    render();

    await saveTrip();

    showToast("費用已儲存");

  };


/* =========================================================
   刪除費用
========================================================= */

async function deleteExpense(id) {

  if (
    !confirm("確定要刪除這筆費用嗎？")
  ) {
    return;
  }

  expenses =
    expenses.filter(
      x => x.id !== id
    );

  render();

  await saveTrip();

  showToast("費用已刪除");

}


/* =========================================================
   FAB
========================================================= */

document.getElementById("addBtn")
  .onclick = () => {

    if (currentPage === "schedule") {

      openTripModal();

    } else {

      openExpenseModal();

    }

  };


/* =========================================================
   分享網址
========================================================= */

async function shareUrl() {

  const url =
    location.href;

  try {

    if (
      navigator.share
    ) {

      await navigator.share({

        title:"🇭🇰 香港旅遊共編",

        text:"一起編輯香港旅遊行程",

        url

      });

    } else {

      await navigator.clipboard
        .writeText(url);

      showToast(
        "共編網址已複製"
      );

    }

  } catch(error) {

    console.log(error);

  }

}


/* =========================================================
   CSV 匯出
========================================================= */

function downloadCSV(
  filename,
  rows
) {

  const csv =
    rows
      .map(row =>
        row.map(value => {

          const text =
            String(value ?? "");

          return '"' +
            text.replaceAll('"','""') +
            '"';

        }).join(",")
      )
      .join("\r\n");


  /*
    UTF-8 BOM
    讓 Excel 正確顯示繁體中文
  */

  const blob =
    new Blob(
      ["\uFEFF" + csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


/* =========================================================
   匯出行程
========================================================= */

function exportTrips() {

  const rows = [

    [
      "日期",
      "開始時間",
      "結束時間",
      "行程",
      "交通模式",
      "交通時間",
      "備註",
      "完成"
    ]

  ];


  Object.keys(dayNames)
    .forEach(day => {

      (trips[day] || [])
        .forEach(item => {

          rows.push([

            dayNames[day],

            item.start,

            item.end,

            item.name,

            item.transport,

            item.transportTime,

            item.note,

            item.completed
              ? "已完成"
              : "未完成"

          ]);

        });

    });


  downloadCSV(
    "香港旅遊_行程.csv",
    rows
  );

  showToast("行程 CSV 已匯出");

}


/* =========================================================
   匯出費用
========================================================= */

function exportExpenses() {

  const rows = [

    [
      "日期",
      "費用項目",
      "金額",
      "幣別",
      "付款人",
      "分類",
      "備註"
    ]

  ];


  [...expenses]
    .sort((a,b) =>
      String(a.day)
        .localeCompare(String(b.day))
    )
    .forEach(expense => {

      rows.push([

        dayNames[expense.day] ||
          expense.day,

        expense.name,

        expense.amount,

        expense.currency,

        expense.payer,

        expense.category,

        expense.note

      ]);

    });


  downloadCSV(
    "香港旅遊_費用.csv",
    rows
  );

  showToast("費用 CSV 已匯出");

}
